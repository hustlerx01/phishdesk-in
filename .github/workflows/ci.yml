name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: dataset is reproducible
        run: python data/generate_dataset.py && git diff --exit-code data/
      - run: pytest -q
      - run: python -m phishdesk.evaluate -o eval.json
      - run: python -m phishdesk.cli data/samples -o reports
      - uses: actions/upload-artifact@v4
        with: {name: phishdesk-reports, path: "reports/\neval.json"}
